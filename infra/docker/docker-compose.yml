
services:
  postgres:
    image: postgres:15
    container_name: life-planner-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lifeplanner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: life-planner-api
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lifeplanner
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      - postgres

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: life-planner-web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data: